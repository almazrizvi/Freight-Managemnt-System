<div class="roles-container">
  <div class="roles-header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>User Roles Management</h1>
  </div>

  <div class="roles-wrapper">
    <div *ngIf="isLoading" class="loading">Loading roles...</div>

    <div class="roles-info">
      <h2>Available Roles</h2>
      <div class="roles-grid">
        <div class="role-card" *ngFor="let role of roles">
          <h3>{{ role.name }}</h3>
          <p>{{ role.description }}</p>
        </div>
      </div>
    </div>

    <div class="users-roles" *ngIf="!isLoading && users.length > 0">
      <h2>User Role Assignments</h2>
      <table mat-table [dataSource]="users" class="roles-table">
        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <!-- Full Name Column -->
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Full Name</th>
          <td mat-cell *matCellDef="let user">{{ user.fullName }}</td>
        </ng-container>

        <!-- Roles Column -->
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let user">
            <mat-form-field appearance="outline">
              <mat-label>Select Role</mat-label>
              <mat-select>
                <mat-option *ngFor="let role of roles" [value]="role.id">
                  {{ role.name }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button (click)="assignRole(user)" matTooltip="Assign role">
              <mat-icon>check_circle</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <div *ngIf="!isLoading && users.length === 0" class="no-users">
      <p>No users to assign roles. <a [routerLink]="['/admin/users/create']">Create a user first</a></p>
    </div>
  </div>
</div>
