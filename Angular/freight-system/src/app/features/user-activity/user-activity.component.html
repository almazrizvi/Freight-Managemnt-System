<div class="activity-container">
  <div class="activity-header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>User Activity Log</h1>
    <button mat-raised-button (click)="exportActivity()">
      <mat-icon>download</mat-icon>
      Export Log
    </button>
  </div>

  <div class="activity-wrapper">
    <div *ngIf="isLoading" class="loading">Loading activity log...</div>

    <table mat-table [dataSource]="activities" class="activity-table" *ngIf="!isLoading && activities.length > 0">
      <!-- User Column -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let activity">{{ activity.user }}</td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let activity">
          <span class="action-badge" [ngClass]="'action-' + activity.action.toLowerCase()">
            {{ activity.action }}
          </span>
        </td>
      </ng-container>

      <!-- Timestamp Column -->
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef>Timestamp</th>
        <td mat-cell *matCellDef="let activity">{{ activity.timestamp | date:'short' }}</td>
      </ng-container>

      <!-- Details Column -->
      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Details</th>
        <td mat-cell *matCellDef="let activity">{{ activity.details }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="!isLoading && activities.length === 0" class="no-activity">
      <p>No activity logged yet.</p>
    </div>
  </div>
</div>
