<div class="permissions-container">
  <div class="permissions-header">
    <button mat-icon-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>User Permissions Management</h1>
    <div class="actions">
      <button mat-stroked-button (click)="resetPermissions()">
        <mat-icon>refresh</mat-icon>
        Reset
      </button>
      <button mat-raised-button color="primary" (click)="savePermissions()">
        <mat-icon>save</mat-icon>
        Save Permissions
      </button>
    </div>
  </div>

  <div class="permissions-wrapper">
    <div *ngIf="isLoading" class="loading">Loading permissions...</div>

    <table mat-table [dataSource]="permissions" class="permissions-table" *ngIf="!isLoading && permissions.length > 0">
      <!-- Permission Column -->
      <ng-container matColumnDef="permission">
        <th mat-header-cell *matHeaderCellDef>Permission</th>
        <td mat-cell *matCellDef="let perm">
          <div class="permission-info">
            <h4>{{ perm.name }}</h4>
            <p>{{ perm.description }}</p>
          </div>
        </td>
      </ng-container>

      <!-- Read Column -->
      <ng-container matColumnDef="read">
        <th mat-header-cell *matHeaderCellDef>Read</th>
        <td mat-cell *matCellDef="let perm">
          <mat-checkbox [(ngModel)]="perm.read"></mat-checkbox>
        </td>
      </ng-container>

      <!-- Write Column -->
      <ng-container matColumnDef="write">
        <th mat-header-cell *matHeaderCellDef>Write</th>
        <td mat-cell *matCellDef="let perm">
          <mat-checkbox [(ngModel)]="perm.write"></mat-checkbox>
        </td>
      </ng-container>

      <!-- Delete Column -->
      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef>Delete</th>
        <td mat-cell *matCellDef="let perm">
          <mat-checkbox [(ngModel)]="perm.delete"></mat-checkbox>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="!isLoading && permissions.length === 0" class="no-permissions">
      <p>No permissions configured yet.</p>
    </div>
  </div>
</div>
