<div class="login-container">
  <mat-card class="login-card">
    <!-- Login Form -->
    <div *ngIf="!registerMode">
      <mat-card-header class="card-header">
        <div class="logo-section">
          <span class="logo-icon">🚚</span>
          <h1>Freight System</h1>
        </div>
      </mat-card-header>

      <mat-card-content>
        <h2>Sign In</h2>
        <p class="demo-info">Demo credentials: <strong>demo</strong> / <strong>password</strong></p>

        <form (ngSubmit)="login()" class="login-form">
          <mat-form-field class="full-width">
            <mat-label>Username</mat-label>
            <input matInput [(ngModel)]="username" name="username" required />
            <mat-icon matSuffix>person</mat-icon>
          </mat-form-field>

          <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="password" name="password" required />
            <mat-icon matSuffix>lock</mat-icon>
          </mat-form-field>

          <div *ngIf="error" class="error-message">
            <mat-icon>error</mat-icon>
            <span>{{ error }}</span>
          </div>

          <div class="button-group">
            <button mat-raised-button color="primary" type="submit" class="full-width">
              Sign In
            </button>
            <button mat-stroked-button type="button" (click)="toggleRegister()" class="full-width">
              Create Account
            </button>
          </div>
        </form>
      </mat-card-content>
    </div>

    <!-- Register Form -->
    <div *ngIf="registerMode">
      <mat-card-header class="card-header">
        <div class="logo-section">
          <span class="logo-icon">🚚</span>
          <h1>Freight System</h1>
        </div>
      </mat-card-header>

      <mat-card-content>
        <h2>Create Account</h2>

        <form (ngSubmit)="register()" class="login-form">
          <mat-form-field class="full-width">
            <mat-label>Username</mat-label>
            <input matInput [(ngModel)]="regUsername" name="regUsername" required />
            <mat-icon matSuffix>person</mat-icon>
          </mat-form-field>

          <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="regPassword" name="regPassword" required />
            <mat-icon matSuffix>lock</mat-icon>
          </mat-form-field>

          <mat-form-field class="full-width">
            <mat-label>Confirm Password</mat-label>
            <input matInput type="password" [(ngModel)]="regConfirm" name="regConfirm" required />
            <mat-icon matSuffix>lock_outline</mat-icon>
          </mat-form-field>

          <div *ngIf="regError" class="error-message">
            <mat-icon>error</mat-icon>
            <span>{{ regError }}</span>
          </div>

          <div *ngIf="regSuccess" class="success-message">
            <mat-icon>check_circle</mat-icon>
            <span>{{ regSuccess }}</span>
          </div>

          <div class="button-group">
            <button mat-raised-button color="primary" type="submit" class="full-width">
              Register
            </button>
            <button mat-stroked-button type="button" (click)="toggleRegister()" class="full-width">
              Back to Login
            </button>
          </div>
        </form>
      </mat-card-content>
    </div>
  </mat-card>
</div>
