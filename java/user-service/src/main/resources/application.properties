spring.application.name=user-service
server.port=9110
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Default profile
spring.profiles.active=dev

# Cloud Config - Disable import check to allow startup without config server
spring.cloud.config.enabled=false

# Fallback configuration (if Config Server unavailable)
spring.datasource.url=jdbc:postgresql://localhost:5432/freight_system
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Fallback)
jwt.secret=freight-system-secret-key-change-in-production-environment-please-rotate
jwt.expiration=3600000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha



