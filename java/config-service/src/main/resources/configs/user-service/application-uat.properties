spring.application.name=user-service
server.port=9110
eureka.client.service-url.defaultZone=http://eureka-uat:9020/eureka/

# Database Configuration (UAT - External PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres-uat.internal:5432/freight_uat
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:W3evayxhC5S7XEDpxciysA==}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.root=WARN
logging.level.com.freight.management.user_service=INFO
logging.level.org.springframework.web=WARN

# Application Settings
spring.application.display-name=User Service (UAT)
app.environment=uat
app.debug=false
