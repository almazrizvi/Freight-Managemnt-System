spring.application.name=user-service
server.port=9110
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Database Configuration (Default - Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/freight_system
spring.datasource.username=postgres
spring.datasource.password=W3evayxhC5S7XEDpxciysA==
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
jwt.secret=freight-system-secret-key-change-in-production-environment-please-rotate
jwt.expiration=3600000

# Application Settings
spring.application.display-name=User Service
app.environment=default
