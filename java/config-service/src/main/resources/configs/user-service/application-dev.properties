spring.application.name=user-service
server.port=9110
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Database Configuration (Development - Local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/freight_dev
spring.datasource.username=postgres
spring.datasource.password=W3evayxhC5S7XEDpxciysA==
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.root=INFO
logging.level.com.freight.management.user_service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=freight-system-secret-key-dev-environment-please-rotate-before-sharing
jwt.expiration=3600000

# Application Settings
spring.application.display-name=User Service (Development)
app.environment=dev
