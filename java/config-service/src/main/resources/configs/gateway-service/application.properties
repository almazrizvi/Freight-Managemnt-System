spring.application.name=gateway-service
server.port=9010
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Gateway Routes Configuration
# User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}
spring.cloud.gateway.routes[1].id=scheduler-service
spring.cloud.gateway.routes[1].uri=lb://scheduler-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/scheduler/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}
spring.cloud.gateway.routes[2].id=shipment-service
spring.cloud.gateway.routes[2].uri=lb://shipment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shipments/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}
spring.cloud.gateway.routes[3].id=billing-service
spring.cloud.gateway.routes[3].uri=lb://billing-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}
spring.cloud.gateway.routes[4].id=tracking-service
spring.cloud.gateway.routes[4].uri=lb://tracking-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/tracking/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}

# CORS configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allow-credentials=false

# JWT Configuration (DISABLED for now)
jwt.enabled=false
jwt.secret=freight-system-secret-key-change-in-production-environment-please-rotate
jwt.expiration=3600000

# Application Settings
spring.application.display-name=API Gateway
app.environment=default
