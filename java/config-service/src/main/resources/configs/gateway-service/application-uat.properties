spring.application.name=gateway-service
server.port=9010
eureka.client.service-url.defaultZone=http://eureka-uat:9020/eureka/

# Gateway Routes Configuration
# User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}

# CORS configuration (restricted for production)
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=https://freight-uat.example.com
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].max-age=3600

# Rate Limiting (optional)
spring.cloud.gateway.property-name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[1]=name=RequestRateLimiter,args={redis-rate-limiter.replenishRate=100,redis-rate-limiter.burstCapacity=200}

# Logging
logging.level.root=WARN
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web=WARN

# Application Settings
spring.application.display-name=API Gateway (UAT)
app.environment=uat
app.debug=false
