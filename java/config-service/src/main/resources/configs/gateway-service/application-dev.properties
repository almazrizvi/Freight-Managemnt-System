spring.application.name=gateway-service
server.port=9010
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Gateway Routes Configuration
# User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/(?<segment>.*),/$\\{segment}

# CORS configuration (more permissive for development)
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:*,http://127.0.0.1:*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].max-age=3600

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

# JWT Configuration (DISABLED for dev - enable when ready for testing)
jwt.enabled=false
jwt.secret=freight-system-secret-key-dev-environment
jwt.expiration=3600000

# Application Settings
spring.application.display-name=API Gateway (Development)
app.environment=dev
app.debug=true
