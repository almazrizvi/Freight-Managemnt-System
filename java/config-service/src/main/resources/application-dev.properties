# Development profile configuration
# This profile uses the native file-based backend for configuration

spring.application.name=config-service
server.port=9030
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Use Native Backend (File System) for Development
spring.cloud.config.server.native.search-locations=classpath:/configs,file:./configs

# Disable Spring Cloud Config bootstrap (optional)
spring.cloud.bootstrap.enabled=false

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.config.server=DEBUG
