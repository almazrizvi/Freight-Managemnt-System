spring.application.name=gateway-service
server.port=9010
eureka.client.service-url.defaultZone=http://localhost:9020/eureka/

# Use Reactive Web Application Type (required for Spring Cloud Gateway)
spring.main.web-application-type=reactive

# Import configuration from Config Server
# Format: configserver:http://config-server:port
spring.config.import=optional:configserver:http://localhost:9030

# Default profile (can be overridden with spring.profiles.active)
spring.profiles.active=dev

# Gateway Routes - Using WebFlux Config
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/(?<segment>.*),/$\{segment}

# CORS Configuration - Using WebFlux Config
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# JWT Configuration (DISABLED by default - enable in profiles when ready)
jwt.enabled=false
jwt.secret=freight-system-secret-key-change-in-production-environment
jwt.expiration=3600000
